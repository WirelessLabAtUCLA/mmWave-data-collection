# mmWave Data Collection Configuration

# System
system:
  log_level: "INFO"  # DEBUG, INFO, WARN, ERROR
  data_path: "./data"

# Router (60GHz device)
rx_router:
  host: "192.168.1.101"
  port: 22
  username: "root"
  key_file: "~/.ssh/id_ed25519"  # Path to SSH private key
  
  # CSI Collection parameters
  mac_address: "\\xf4\\x1e\\x57\\x64\\x92\\xae"  # MAC address for vendor command
  remote_file: "/tmp/csi_measurements.txt"  # Where measurements are stored on router
  remote_script: "/scripts/collect_csi.sh"      # Script location on router
  
  # Batch collection (run script -> collect N measurements -> SCP back -> publish)
  measurements_per_batch: 5     # Number of measurements per batch (5 takes ~1 sec)
  batch_interval: 1.0           # Seconds between batch collections (matches GPS rate)
  connection_timeout: 10        # Seconds to wait for wlan0 connection

tx_router:
  host: "192.168.1.100"
  port: 22
  username: "root"
  key_file: "~/.ssh/id_ed25519"
  
  command: "hostapd -B /etc/hostapd.conf"
  timeout: 30.0
  channel: 1

# GPS
gps:
  enabled: true
  auto_detect: true  # Auto-detect device path
  device: "auto"     # or specify: /dev/ttyUSB0 (Linux), /dev/cu.usbserial-* (Mac)
  baudrate: 9600

# Camera
camera:
  enabled: true
  device_id: 0  # Try 0, 1, 2 if not found
  width: 1920
  height: 1080
  jpeg_quality: 85

# Data Sync
sync:
  time_tolerance: 0.5  # seconds - how close timestamps must be
  
# Storage
storage:
  save_rosbag: true
  organize_by_date: true

